<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0d47a1">
<title>Historia Clínica por Voz</title>
<style>
  :root{
    --azul:#1a73e8; --azul-osc:#0d47a1; --tinta:#14203a; --sec:#5d6b82;
    --linea:#dbe4f1; --fondo1:#eef4fc; --fondo2:#dbe8fa; --rojo:#e53935; --ok:#1a7a4c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(165deg,var(--fondo1) 0%,var(--fondo2) 100%);
    color:var(--tinta); min-height:100dvh;
    padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  .card{
    width:100%; max-width:460px; background:#fff; border-radius:22px;
    box-shadow:0 20px 50px rgba(13,42,82,.15); overflow:hidden; align-self:flex-start;
    display:flex; flex-direction:column;
  }
  header{background:linear-gradient(135deg,var(--azul) 0%,var(--azul-osc) 100%); color:#fff; padding:26px 26px 22px}
  header h1{margin:0; font-size:20px; font-weight:800; letter-spacing:-.2px}
  header p{margin:6px 0 0; font-size:13.5px; opacity:.9}
  .body{padding:22px 22px 26px}
  label{display:block; font-size:12.5px; font-weight:700; color:#33435c; letter-spacing:.2px; margin:0 0 6px}
  input[type=text]{
    width:100%; font-size:16px; border:1.5px solid var(--linea); border-radius:12px;
    padding:13px 15px; background:#f7fafd; color:var(--tinta); margin-bottom:16px;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  input[type=text]:focus{border-color:var(--azul); background:#fff; outline:none; box-shadow:0 0 0 4px rgba(26,115,232,.14)}
  .rec-wrap{display:flex; flex-direction:column; align-items:center; margin:10px 0 6px}
  .rec{
    width:132px; height:132px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--azul) 0%,var(--azul-osc) 100%); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 10px 26px rgba(26,115,232,.4); user-select:none; -webkit-user-select:none;
    transition:transform .12s,box-shadow .15s,background .2s; touch-action:none;
  }
  .rec svg{width:44px;height:44px;fill:#fff}
  .rec .lbl{font-size:13px;font-weight:700}
  .rec:active{transform:scale(.96)}
  .rec.grabando{background:linear-gradient(135deg,#ef5350,#c62828); animation:pulso 1.4s infinite}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(229,57,53,.5)}70%{box-shadow:0 0 0 22px rgba(229,57,53,0)}100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}}
  .hint{font-size:13px; color:var(--sec); text-align:center; margin:14px 0 0; min-height:20px}
  .timer{font-variant-numeric:tabular-nums; font-size:34px; font-weight:800; color:var(--tinta); text-align:center; margin:16px 0 2px; letter-spacing:1px}
  .stop{
    display:none; margin:12px auto 0; border:none; cursor:pointer; background:#fff;
    color:var(--rojo); border:2px solid var(--rojo); border-radius:30px; font-weight:800;
    font-size:15px; padding:11px 26px;
  }
  .preview{display:none; margin-top:18px; text-align:center}
  audio{width:100%; margin-top:6px}
  .rehacer{background:none; border:none; color:var(--azul); font-weight:700; font-size:13.5px; cursor:pointer; margin-top:10px; text-decoration:underline}
  .foto{margin-top:20px}
  .foto-btn{
    display:flex; align-items:center; gap:10px; width:100%; justify-content:center;
    border:1.5px dashed #c4d3e8; background:#f7fafd; border-radius:12px; padding:13px;
    font-size:14px; font-weight:700; color:var(--azul); cursor:pointer;
  }
  .foto-btn svg{width:20px;height:20px;fill:var(--azul)}
  .foto-nombre{font-size:12.5px; color:var(--sec); text-align:center; margin-top:8px; word-break:break-all}
  .enviar{
    width:100%; margin-top:22px; border:none; cursor:pointer; border-radius:30px;
    background:linear-gradient(135deg,var(--azul) 0%,var(--azul-osc) 100%); color:#fff;
    font-weight:800; font-size:16.5px; padding:16px; box-shadow:0 8px 20px rgba(26,115,232,.32);
    transition:filter .15s,transform .12s,opacity .2s;
  }
  .enviar:active{transform:translateY(1px)}
  .enviar:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  .estado{margin-top:16px; text-align:center; font-size:14px; font-weight:600; min-height:20px}
  .estado.err{color:var(--rojo)}
  .estado.ok{color:var(--ok)}
  .spin{display:inline-block; width:16px;height:16px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:g .7s linear infinite; vertical-align:-3px; margin-right:8px}
  @keyframes g{to{transform:rotate(360deg)}}
  .exito{display:none; text-align:center; padding:40px 26px}
  .exito .check{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center}
  .exito .check svg{width:40px;height:40px;fill:#fff}
  .exito h2{margin:0 0 8px;font-size:20px;color:var(--tinta)}
  .exito p{margin:0 0 24px;color:var(--sec);font-size:14.5px}
  .exito button{border:none;background:var(--azul);color:#fff;font-weight:800;font-size:15px;padding:13px 30px;border-radius:30px;cursor:pointer}
</style>

<body>
<div class="card">
  <header>
    <h1>🩺 Historia Clínica por Voz</h1>
    <p>Cargá los datos, dictá la consulta y enviá.</p>
  </header>

  <div class="body" id="form">
    <label for="dni">DNI del paciente *</label>
    <input type="text" id="dni" inputmode="numeric" placeholder="Solo números" autocomplete="off">

    <label for="nombre">Nombre del paciente *</label>
    <input type="text" id="nombre" placeholder="Nombre y apellido" autocomplete="off">

    <label style="text-align:center">Dictar Historia Clínica *</label>
    <div class="rec-wrap">
      <button class="rec" id="btnRec" aria-label="Grabar">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
        <span class="lbl">Mantené<br>presionado</span>
      </button>
      <div class="timer" id="timer" style="display:none">00:00</div>
      <button class="stop" id="btnStop">Detener grabación</button>
      <div class="hint" id="hint">Mantené presionado para dictar, o tocá una vez para manos libres.</div>
    </div>

    <div class="preview" id="preview">
      <audio id="player" controls></audio>
      <div><button class="rehacer" id="btnRehacer">Grabar de nuevo</button></div>
    </div>

    <div class="foto">
      <label>Imagen de estudio (opcional)</label>
      <label class="foto-btn" for="imagen">
        <svg viewBox="0 0 24 24"><path d="M4 5h3l2-2h6l2 2h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
        Adjuntar imagen
      </label>
      <input type="file" id="imagen" accept="image/*" hidden>
      <div class="foto-nombre" id="fotoNombre"></div>
      <label>Resumen de laboratorio en PDF (opcional)</label>
<label class="foto-btn" for="pdf">
  <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5z"/></svg>
  Adjuntar PDF
</label>
<input type="file" id="pdf" accept="application/pdf" hidden>
<div class="foto-nombre" id="pdfNombre"></div>

    </div>
  
    <button class="enviar" id="btnEnviar" disabled>Enviar </button>  
    <div class="estado" id="estado"></div>
  </div>

  <div class="exito" id="exito">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
    <h2>Consulta enviada</h2>
    <p id="exitoMsg">La historia clínica se cargó correctamente.</p>
    <button id="btnOtra">Cargar otra consulta</button>
  </div>
</div>

<script>
/* ====== URL del webhook de n8n (dominio distinto, hay que escribirla completa) ====== */
const WEBHOOK_URL = "https://n8n.patagoniaflow.tech/webhook/carga-voz";

/* ====== estado ====== */
let mediaRecorder, chunks = [], blob = null, stream = null;
let t0 = 0, timerInt = null, holdTimer = null, modoManos = false, grabando = false;

const $ = id => document.getElementById(id);
const btnRec = $("btnRec"), btnStop = $("btnStop"), btnEnviar = $("btnEnviar");
const timerEl = $("timer"), hint = $("hint"), estado = $("estado");

function pickMime(){
  const c = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/mpeg"];
  for (const m of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return "";
}
function ext(m){ if(m.includes("mp4"))return"m4a"; if(m.includes("webm"))return"webm"; if(m.includes("mpeg"))return"mp3"; return"dat"; }

async function iniciar(){
  if (grabando) return;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    hint.textContent = "No pudimos acceder al micrófono. Revisá los permisos del navegador.";
    hint.style.color = "var(--rojo)"; return;
  }
  const mime = pickMime();
  chunks = [];
  mediaRecorder = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
  mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    blob = new Blob(chunks, {type: mediaRecorder.mimeType});
    blob._ext = ext(mediaRecorder.mimeType);
    const url = URL.createObjectURL(blob);
    $("player").src = url;
    $("preview").style.display = "block";
    stream.getTracks().forEach(t=>t.stop());
    validar();
  };
  mediaRecorder.start();
  grabando = true;
  btnRec.classList.add("grabando");
  btnRec.querySelector(".lbl").innerHTML = modoManos ? "Grabando…" : "Soltá para<br>terminar";
  timerEl.style.display = "block";
  $("preview").style.display = "none";
  t0 = Date.now();
  timerInt = setInterval(()=>{
    const s = Math.floor((Date.now()-t0)/1000);
    timerEl.textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  },250);
  if (modoManos){ btnStop.style.display="block"; hint.textContent="Modo manos libres. Tocá «Detener» al terminar."; }
}
function frenar(){
  if (!grabando) return;
  grabando = false;
  clearInterval(timerInt);
  try{ mediaRecorder.stop(); }catch(e){}
  btnRec.classList.remove("grabando");
  btnRec.querySelector(".lbl").innerHTML = "Mantené<br>presionado";
  btnStop.style.display = "none";
  hint.style.color = "var(--sec)";
  hint.textContent = "Listo. Podés escuchar, rehacer o enviar.";
}

btnRec.addEventListener("pointerdown", e=>{
  e.preventDefault();
  if (grabando && modoManos) return;
  modoManos = false;
  holdTimer = setTimeout(()=>{ holdTimer=null; }, 2000);
  iniciar();
});
btnRec.addEventListener("pointerup", e=>{
  e.preventDefault();
  if (holdTimer){
    clearTimeout(holdTimer); holdTimer=null; modoManos=true;
    btnRec.querySelector(".lbl").innerHTML="Grabando…";
    btnStop.style.display="block";
    hint.textContent="Modo manos libres. Tocá «Detener» al terminar.";
    return;
  }
  if (!modoManos) frenar();
});
btnRec.addEventListener("pointercancel", ()=>{ if(!modoManos) frenar(); });
btnStop.addEventListener("click", ()=>{ modoManos=false; frenar(); });

$("btnRehacer").addEventListener("click", ()=>{
  blob=null; $("preview").style.display="none"; timerEl.textContent="00:00"; timerEl.style.display="none";
  hint.textContent="Mantené presionado para dictar, o tocá una vez para manos libres.";
  validar();
});

$("imagen").addEventListener("change", e=>{
  $("fotoNombre").textContent = e.target.files[0] ? e.target.files[0].name : "";
});
$("pdf").addEventListener("change", e=>{
$("pdfNombre").textContent = e.target.files[0] ? e.target.files[0].name : "";
});

$("dni").addEventListener("input", validar);
$("nombre").addEventListener("input", validar);

function validar(){
  const ok = $("dni").value.trim() && $("nombre").value.trim() && blob;
  btnEnviar.disabled = !ok;
}

btnEnviar.addEventListener("click", async ()=>{
  if (btnEnviar.disabled) return;
  btnEnviar.disabled = true;
  estado.className="estado"; estado.innerHTML='<span class="spin"></span>Enviando…';
  const fd = new FormData();
  fd.append("DNI_Paciente", $("dni").value.trim());
  fd.append("Nombre_Paciente", $("nombre").value.trim());
  fd.append("Audio_Consulta", blob, "consulta."+(blob._ext||"m4a"));
  if ($("imagen").files[0]) fd.append("Imagen_Consulta", $("imagen").files[0]);
  if ($("pdf").files[0]) fd.append("PDF_Laboratorio", $("pdf").files[0]);
  try{
    const r = await fetch(WEBHOOK_URL, {method:"POST", body:fd});
    const texto = await r.text();
    if (!r.ok) {
      estado.className="estado err";
      estado.textContent = texto || ("No se pudo procesar la consulta (código " + r.status + ").");
      btnEnviar.disabled=false;
      return;
    }
    $("exitoMsg").textContent = texto || "La historia clínica se cargó correctamente.";
    $("form").style.display="none"; $("exito").style.display="block";
  }catch(err){
    estado.className="estado err";
    estado.textContent="No se pudo enviar. Revisá la conexión y probá de nuevo. (El audio no se perdió.)";
    btnEnviar.disabled=false;
  }
});

$("btnOtra").addEventListener("click", ()=>{
  $("dni").value=""; $("nombre").value=""; $("imagen").value=""; $("fotoNombre").textContent="";
  blob=null; $("preview").style.display="none"; timerEl.textContent="00:00"; timerEl.style.display="none";
  estado.textContent=""; estado.className="estado";
  $("exito").style.display="none"; $("form").style.display="block";
  hint.style.color="var(--sec)"; hint.textContent="Mantené presionado para dictar, o tocá una vez para manos libres.";
  validar();
});
</script>
</body>
</html>
